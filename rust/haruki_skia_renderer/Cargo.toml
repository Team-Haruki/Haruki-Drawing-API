[package]
name = "haruki_skia_renderer"
version = "0.1.0"
edition = "2024"

[lib]
name = "haruki_skia_renderer"
crate-type = ["cdylib"]

[dependencies]
moka = { version = "0.12.11", features = ["sync"] }
mtpng = "0.4.1"
rayon = "1.10.0"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep SVG/textlayout/GPU modules out of the CPU renderer. WebP is an accepted asset
# format, so enable its decoder explicitly. Upstream has no minimal webpd binary
# variant: CI installs the source-build toolchain and caches the compiled Skia tree.
# Color emoji still uses a COLR font (TwemojiMozilla), rendered by FreeType.
skia-safe = { version = "0.99.0", features = ["webp-decode"] }
freetype-rs = "0.38.0"

# Linux already links system FreeType for Skia. macOS Skia uses CoreText, so
# statically bundle the BASIC scaler rather than shipping a Homebrew dylib path.
[target.'cfg(target_os = "macos")'.dependencies]
freetype-rs = { version = "0.38.0", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
