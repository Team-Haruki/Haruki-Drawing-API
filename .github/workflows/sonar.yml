name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install CPython free-threaded
        run: uv python install cpython-3.14.3+freethreaded

      - name: Install Skia link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev ninja-build pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/haruki_skia_renderer
          shared-key: sonar-skia-renderer

      # Fonts are OFL/CC licensed and too large to vendor; download once and cache.
      - name: Cache CI fonts
        id: font-cache
        uses: actions/cache@v6
        with:
          path: |
            data/SourceHanSansSC-Regular.otf
            data/SourceHanSansSC-Bold.otf
            data/SourceHanSansSC-Heavy.otf
            data/TwemojiMozilla.ttf
          key: ci-fonts-source-han-sans-release-twemoji-mozilla-v0.7.0

      - name: Download CI fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p data
          for weight in Regular Bold Heavy; do
            curl -fsSL --retry 3 -o "data/SourceHanSansSC-${weight}.otf" \
              "https://github.com/adobe-fonts/source-han-sans/raw/release/OTF/SimplifiedChinese/SourceHanSansSC-${weight}.otf"
          done
          # COLR-format Twemoji: FreeType/Skia render it in color with default features
          # (the SVGinOT variant only yields monochrome fallbacks on the Linux backend).
          curl -fsSL --retry 3 -o data/TwemojiMozilla.ttf \
            "https://github.com/mozilla/twemoji-colr/releases/download/v0.7.0/Twemoji.Mozilla.ttf"
          ls -l data/SourceHanSansSC-*.otf data/TwemojiMozilla.ttf

      - name: Create 3.14t venv and sync dependencies
        run: |
          uv venv .venv314t --python cpython-3.14.3+freethreaded
          UV_PROJECT_ENVIRONMENT=.venv314t uv sync --frozen --all-groups --python .venv314t/bin/python --no-build

      - name: Repair pjsekai_scores_rs FreeType linkage
        run: |
          set -euo pipefail
          system_freetype="$(ldconfig -p | awk '/libfreetype\.so\.6 / { print $NF; exit }')"
          bundled_freetype="$(find .venv314t/lib -path '*/pjsekai_scores_rs_skia_image.libs/libfreetype-*.so.6' -print -quit)"
          if [ -n "$bundled_freetype" ]; then
            test -n "$system_freetype"
            rm "$bundled_freetype"
            ln -s "$system_freetype" "$bundled_freetype"
          fi
          .venv314t/bin/python -c "import pjsekai_scores_rs; from pjsekai_scores_rs import Drawing; print(Drawing.jpg)"

      - name: Build haruki_skia_renderer in coverage environment
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv314t
        run: .venv314t/bin/maturin develop --uv --release --manifest-path rust/haruki_skia_renderer/Cargo.toml

      - name: Verify native renderer capability handshake
        run: .venv314t/bin/python -c "import haruki_skia_renderer as m; from src.sekai.skia_renderer.canvas import REQUIRED_NATIVE_IR_CAPABILITY; assert m.IR_CAPABILITY >= REQUIRED_NATIVE_IR_CAPABILITY, m.IR_CAPABILITY; print('IR_CAPABILITY =', m.IR_CAPABILITY)"

      - name: Generate Python coverage report
        run: |
          .venv314t/bin/python -X gil=0 -m coverage run -m pytest -q
          .venv314t/bin/python -X gil=0 -m coverage xml --fail-under=0 -o coverage.xml

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Keep this after the scan: until the legacy suite reaches 90%, Sonar must
      # still receive every report so staged quality improvements stay visible.
      - name: Enforce 90% overall Python coverage
        run: .venv314t/bin/python -X gil=0 -m coverage report
