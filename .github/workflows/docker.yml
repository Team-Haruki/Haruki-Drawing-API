name: Build Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  renderer-wheels:
    uses: ./.github/workflows/skia-wheels.yml
    # The image only ships the Linux wheel; the macOS wheel still builds on main and tag pushes.
    with:
      linux-only: true
    permissions:
      contents: read

  docker:
    needs: renderer-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the wheel that passed native smoke validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RELEASE_RUN_ID" --name haruki-skia-renderer-linux-x86_64 --dir docker/skia-wheels
          test "$(find docker/skia-wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release (v3.0.0-rc1, v2.9.0-beta.2, ...) must NOT move `:latest`. Anything deploying
      # `:latest` would silently pick up the release candidate, which is the one thing an RC is
      # supposed not to be. Only a plain vX.Y.Z tag is allowed to claim it.
      - name: Decide whether this tag claims :latest
        id: tags
        run: |
          IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          VERSION=${{ github.ref_name }}
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          NEWEST_STABLE_TAG=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$VERSION" == "$NEWEST_STABLE_TAG" ]]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is the newest stable release; publish :latest"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is a prerelease or maintenance release; preserve :latest"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute build date
        id: meta
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # The path context keeps the downloaded wheel in docker/skia-wheels (the default Git context
      # would not have it). Provenance stays off so the pushed tags remain single-platform
      # manifests rather than an attestation index, exactly as `docker push` produced them.
      # GitHub scopes caches per tag, so the gha cache is reused by re-runs of the same tag and
      # not across releases.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.push_latest == 'true' && format('{0}:latest', steps.tags.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

