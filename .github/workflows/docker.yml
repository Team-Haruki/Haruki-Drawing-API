name: Build Docker Image

on:
  push:
    tags:
      - "v*"

jobs:
  renderer-wheels:
    uses: ./.github/workflows/skia-wheels.yml
    permissions:
      contents: read

  docker:
    needs: renderer-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the wheel that passed native smoke validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RELEASE_RUN_ID" --name haruki-skia-renderer-linux-x86_64 --dir docker/skia-wheels
          test "$(find docker/skia-wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release (v3.0.0-rc1, v2.9.0-beta.2, ...) must NOT move `:latest`. Anything deploying
      # `:latest` would silently pick up the release candidate, which is the one thing an RC is
      # supposed not to be. Only a plain vX.Y.Z tag is allowed to claim it.
      - name: Decide whether this tag claims :latest
        id: tags
        run: |
          IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          VERSION=${{ github.ref_name }}
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$VERSION is a stable release — it will also be pushed as :latest"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is a pre-release — :latest will NOT be moved"
          fi

      - name: Build Docker image
        run: |
          IMAGE_NAME=${{ steps.tags.outputs.image }}
          VERSION=${{ steps.tags.outputs.version }}
          TAGS="-t $IMAGE_NAME:$VERSION"
          if [[ "${{ steps.tags.outputs.is_prerelease }}" == "false" ]]; then
            TAGS="$TAGS -t $IMAGE_NAME:latest"
          fi
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            $TAGS .

      - name: Push Docker image
        run: |
          IMAGE_NAME=${{ steps.tags.outputs.image }}
          VERSION=${{ steps.tags.outputs.version }}
          docker push $IMAGE_NAME:$VERSION
          if [[ "${{ steps.tags.outputs.is_prerelease }}" == "false" ]]; then
            docker push $IMAGE_NAME:latest
          else
            echo "pre-release: skipping :latest"
          fi
