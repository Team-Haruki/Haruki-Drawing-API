assets:
  base_dir: ./data
  result_asset_path: static_images
  tmp_path: tmp
  tri_paths:
    - ./data/static_images/triangle/tri1.png
    - ./data/static_images/triangle/tri2.png
    - ./data/static_images/triangle/tri3.png
  # Asset source: local (default, today's <base_dir>/asset/... tree) or mirror (fetch on demand from Garage).
  # source: local
  # mirror:
  #   dir: mirror                    # relative to base_dir
  #   provider:
  #     provider: garage
  #     scheme: s3                   # fs | s3 ("local" is accepted as fs)
  #     endpoint: http://100.64.0.9:3900
  #     bucket: pjsk-assets
  #     root: ""                     # keep empty: object keys already are <region>-assets/<mode>/<rel> (A9(7))
  #     region: garage
  #     path_style: true
  #     # access_key_id / secret_access_key: env only,
  #     # HARUKI_ASSETS__MIRROR__PROVIDER__ACCESS_KEY_ID / HARUKI_ASSETS__MIRROR__PROVIDER__SECRET_ACCESS_KEY

font:
  dir: ./data
  default: 
    default: SourceHanSansSC-Regular
    bold: SourceHanSansSC-Bold
    heavy: SourceHanSansSC-Heavy
    emoji: TwitterColorEmoji-SVGinOT  # macOS 开发机:CoreText 后端渲染 OT-SVG 彩色(COLR 在 mac scaler 下是空白);Linux 生产用 TwemojiMozilla(见 configs.docker.yaml)

drawing:
  thread_pool_size: 8
  isolated_worker_pool_size: 4  # 跟 CPU 配额走:实测 4 个的 p50 和吞吐都优于 8 个(超订反而更慢)
  isolated_worker_queue_limit: 16
  isolated_worker_queue_timeout_seconds: 30
  request_hard_timeout_seconds: 180
  overload_max_inflight_requests: 64
  overload_retry_after_seconds: 5
  readiness_unhealthy_inflight_requests: 48
  # 关掉:它只看父进程 VmRSS,看不见 heavy worker(内存主项),而父进程 RSS 是随并发线性涨的
  # (实测 1/4/8/12 并发 = 483/757/838/958 MB),所以它本质是一道校准错了的"并发门"——
  # 1536 会在并发 ~26 触发,抢在真正的并发门(inflight 48)前面开火。内存交给 cgroup 门。
  readiness_unhealthy_rss_mb: 0
  readiness_unhealthy_asyncio_tasks: 256
  # 容器内存用量达到硬限额的 90% 时 /ready 报 503。这是唯一能看见 heavy worker 的信号。
  # 不在受限 cgroup 里(裸机/macOS/无限额容器)时自动失效,不猜。
  readiness_unhealthy_cgroup_percent: 90
  image_cache_size: 1024
  image_cache_max_mb: 256
  thumbnail_cache_size: 2048
  thumbnail_cache_max_mb: 256
  composed_image_cache_size: 2048
  composed_image_cache_max_mb: 256
  composed_image_cache_ttl_seconds: 604800
  export_image_format: png  # png 或 jpg
  jpg_quality: 85  # JPEG 压缩质量 (1-100)，仅在 export_image_format 为 jpg 时生效
  custom_profile_assets_dir: data/asset/{region}-assets/startapp/custom_profile
  custom_profile_fonts_dir: data/asset/{region}-assets/startapp/custom_profile/font
  custom_profile_tmp_font_metadata: data/custom_profile/tmp-font-assets/{region}/metadata.json
  custom_profile_shape_sprite_dir: data/asset/{region}-assets/startapp/custom_profile/shape
  custom_profile_unity_ui_sprite_dir: data/drawing/static_images/customprofile
  custom_profile_parallel_workers: 1
  # 用户场景硬边界:防止异常 scale/元素数在裁剪前制造 GiB 级临时栅格
  custom_profile_max_concurrent_requests: 1
  custom_profile_max_elements: 256
  custom_profile_max_scale: 8.0
  custom_profile_max_text_size: 1024.0
  custom_profile_max_text_length: 4096
  custom_profile_max_layer_pixels: 8388608
  custom_profile_max_scene_mb: 256
  # custom profile 进程级缓存(字形 SDF/轮廓、sprite/atlas);任一对归零即禁用对应池
  custom_profile_glyph_cache_size: 4096
  custom_profile_glyph_cache_max_mb: 64
  custom_profile_sprite_cache_size: 512
  custom_profile_sprite_cache_max_mb: 128

server:
  host: 0.0.0.0
  port: 28000

logging:
  level: INFO
  format: "[%(asctime)s][%(levelname)s][%(name)s] %(message)s"
  field_styles:
    asctime:
      color: green
    levelname:
      color: blue
      bold: true
    name:
      color: magenta
    message:
      color: 144
      bright: false

# Artifact output (X-Haruki-Artifact: 1 uploads the rendered image to Garage). Off by default.
